# Options for your specific RBA model (e.g., path names, model defaults). See model_defaults.py for more details.
# To help identify ribosome subunits, choose one of the following (or whichever is closest): yeast, bacteria, mammal.
organism_type: yeast
# UniProt ID for the proteome of your organism; used to identify ribosome subunits and other proteins in the proteome (e.g., UP000029867 for I. orientalis SD108)
proteome: UP000029867
# Extra proteins (listed by their UniProt accessions) to include in the proteome; these will be added to the proteome if they are not already present (e.g., ['A0A1D8P9R7', 'A0A1D8P9R8'])
extra_proteins: ['A0A2U9RAK4','A0A2U9RAV5','A0A2U9RBW3','A0A2U9RBK5','A0A2U9RCF9','A0A2U9RAR9','A0A2U9RBJ3','A0A2U9RCC6','A0A2U9RB22','A0A2U9RCH4','A0A2U9RAU9','A0A2U9RAN3','A0A2U9RB35','A0A2U9RAL6']
# Path for stoichiometric model (SM), relative to this file
SM_path: ../build_model/input/iIsor850_RBA.json
# Regular expression for identifying exchange reactions in the SM; used to identify which reactions to ignore when checking mass balance (e.g., '^EX_' for reactions starting with 'EX_')
exchange_regex: '^EX_'
# Where the SM stores UniProt IDs; write as if accessing "model.genes.<gene_id>." followed by the attribute (e.g., 'annotation["uniprot"]' to access a gene's "annotation" dictionary and get the value for the "uniprot" key)
protein_id_in_gene_format: 'annotation["uniprot"]'
# Biomass reaction ID for SM, ideally using the same composition as RBA biomass reaction
SM_biomass_id: Biomass_MFA
# Biomass reaction ID for RBA model
RBA_biomass_id: BIOSYN-BIODILAERO-NOGAM
# ID for compartment representing cytosol
cytosol: c
# IDs for compartment(s) representing mitochondria and their membrane/surface; if none, set to []
mito_compartments: ['m', 'mm']
max_allowed_mito_proteome_allo_fraction: 1 # maximum fraction of proteome that can be allocated to mitochondria (including both mitochondrial matrix and membrane proteins)
# Gene-Protein Reaction associations (GPRs) representing spontaneous reactions (i.e., no enzyme needed in model) or unknown subunits
spont_GPRs: ['SPONT', 'UNKNOWN', 'TRUE']
# (Optional) For running decompartmentalization tests; add dictionary of compartments to allow decompartmentalization from (keys) and their new compartments (values) (e.g., {'m':'c'} to decompartmentalize mitochondrial proteins into cytosol)
decomp_compartments: {'m':'c', 'mm':'c'}
# (Optional) Rxns to include even if blocked; useful for yield calculations where a reaction is needed for the model to run but is not active under certain conditions
must_include_rxns: ['ACONTb_c']
# (Optional; delete or comment out to ignore ribosomes) Dictionary of ribosome abbreviations followed by paths to their sheets (e.g., '_c':'./input/RIBOSOME_nucleus.xlsx' for ribosome produced in compartment 'c')
## If the files listed don't exist, the model will default to using ribosome_composition.yaml, which is generated by B2_min_flux_violation.py and can be edited as needed.
ribo_dict: {'_c':'./input/RIBOSOME_nucleus.xlsx', '_m':'./input/RIBOSOME_mitochondria.xlsx'}
# (Optional) Remove blocked reactions from the RBA model; set to True or False
remove_blocked_reactions: False
# (Optional) Whether to always let proteins appear in the compartment where they're encoded (True is more lenient and less prone to arbitrarily excluding locations, but may be less accurate if only a protein's mRNA appears in its encoded compartment). 
## pkRBA was built with this set to True; so if extract_enzymes_info_uniprot file is causing issues when set to False, try setting it to True.
always_localize_in_encoded_compartment: True 